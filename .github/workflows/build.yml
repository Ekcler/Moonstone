name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onedir --noconfirm --noconsole --name SakuraFlow \
            --manifest manifest.xml \
            --add-data "icons;icons" \
            --add-data "zapret;zapret" \
            --add-data "src;src" \
            --icon=icons/moonstone.ico \
            --version-file=version.py \
            src/main.py

      - name: Verify build output
        run: |
          ls -la dist/SakuraFlow/
          dist/SakuraFlow/SakuraFlow.exe --help 2>&1 | head -5 || true

      - name: Create release archive
        run: |
          cd dist
          7z a ../SakuraFlow-${{ github.ref_name }}.zip SakuraFlow/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraFlow-windows
          path: dist/SakuraFlow/
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SakuraFlow-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false